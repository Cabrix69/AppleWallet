name: Build Unsigned IPA

on:
  workflow_dispatch:   # lo fai partire a mano

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned archive
        run: |
          cd ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme WalletApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $GITHUB_WORKSPACE/build/WalletApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/WalletApp.xcarchive/Products/Applications/*.app Payload/
          zip -r WalletApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalletApp-ipa
          path: WalletApp.ipa
